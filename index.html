<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Treadmill BLE check</title>
<style>
  :root{
    --navy:#2E6285; --ink:#101418;
    box-sizing:border-box;
    padding-top:env(safe-area-inset-top,0px);
    padding-bottom:env(safe-area-inset-bottom,0px);
  }
  *,*::before,*::after{box-sizing:inherit}
  html,body{margin:0;background:#fff;color:var(--ink)}
  body{font-family:-apple-system,BlinkMacSystemFont,system-ui,sans-serif;
       padding:12px;max-width:520px;margin:0 auto;-webkit-text-size-adjust:100%}
  h1{font-size:20px;margin:6px 0 4px}
  p.lede{font-size:14px;color:#5A6670;margin:0 0 14px;line-height:1.45}
  button{font-family:inherit;font-weight:700;border:none;border-radius:9px;
         color:#fff;background:var(--navy);padding:15px;font-size:17px;width:100%;
         margin-bottom:9px;touch-action:manipulation}
  button.alt{background:#fff;color:var(--navy);box-shadow:inset 0 0 0 2px var(--navy)}
  button.stop{background:#B4342A}
  button:disabled{opacity:.4}
  .grid{display:flex;gap:9px}
  .grid button{margin-bottom:9px}
  #log{background:#0E1418;color:#D6E2EA;border-radius:9px;padding:11px;
       font:12px/1.5 ui-monospace,Menlo,monospace;white-space:pre-wrap;
       word-break:break-word;min-height:200px;max-height:44vh;overflow-y:auto}
  .ok{color:#6FD38C}.bad{color:#FF8B80}.warn{color:#FFCE6B}.dim{color:#7E93A2}
</style>
</head>
<body>

<h1>Treadmill BLE check</h1>
<p class="lede">Get the belt moving at a slow walk, then tap Scan and pick the treadmill. If the picker does nothing, back out and tap Scan again — it often takes a few goes.</p>

<button id="scan">Scan and connect</button>
<div class="grid">
  <button id="s3" class="alt" disabled>3 km/h</button>
  <button id="s6" class="alt" disabled>6 km/h</button>
  <button id="s10" class="alt" disabled>10 km/h</button>
</div>
<div class="grid">
  <button id="ctrl" class="alt" disabled>Request control</button>
  <button id="start" class="alt" disabled>Send start</button>
</div>
<button id="stop" class="stop" disabled>Stop belt</button>
<button id="copy" class="alt">Copy log</button>

<div id="log"></div>

<script>
(function(){
"use strict";

/* Bluefy reports short UUIDs ("2AD9"), Chrome reports full 128-bit.
   Normalise both to a lowercase 4-char key before comparing. */
function key(u){
  u=String(u).toLowerCase();
  var m=u.match(/^0000([0-9a-f]{4})-0000-1000-8000-00805f9b34fb$/);
  if(m) return m[1];
  if(/^[0-9a-f]{4}$/.test(u)) return u;
  return u;
}
var OPT=['00001826-0000-1000-8000-00805f9b34fb',
         '0000ffe0-0000-1000-8000-00805f9b34fb',
         '0000180a-0000-1000-8000-00805f9b34fb',
         '0000180f-0000-1000-8000-00805f9b34fb',
         0x1826,0xFFE0,0x180A,0x180F];

var logEl=document.getElementById('log');
var cp=null, feat=null, dev=null;
var q=Promise.resolve();

function log(msg,cls){
  var t=new Date().toTimeString().slice(3,8);
  var s=document.createElement('span');
  s.className=cls||''; s.textContent='['+t+'] '+msg+'\n';
  logEl.appendChild(s); logEl.scrollTop=logEl.scrollHeight;
}
function errText(e){
  if(!e) return 'cancelled, or no response from picker';
  return (e.name||'Error')+' — '+(e.message||String(e));
}
function hex(dv){
  var b=[];
  for(var i=0;i<dv.byteLength;i++) b.push(dv.getUint8(i).toString(16).padStart(2,'0'));
  return b.join(' ');
}
function props(c){
  var p=c.properties||{},out=[];
  ['read','write','writeWithoutResponse','notify','indicate'].forEach(function(k){ if(p[k]) out.push(k); });
  return out.join('/')||'none';
}
function withTimeout(p,ms,what){
  return Promise.race([p,new Promise(function(_,rej){
    setTimeout(function(){ rej(new Error('timed out after '+(ms/1000)+'s: '+what)); },ms);
  })]);
}

function cpWrite(bytes,label){
  q = q.then(async function(){
    if(!cp) return;
    var b=new Uint8Array(bytes);
    var dv=new DataView(b.buffer);
    try{
      if(cp.properties && cp.properties.writeWithoutResponse && cp.writeValueWithoutResponse){
        await cp.writeValueWithoutResponse(b);
      }else{
        await cp.writeValue(b);
      }
      log('Sent '+label+': '+hex(dv),'ok');
    }catch(e){
      try{
        await cp.writeValue(b);
        log('Sent '+label+' (fallback): '+hex(dv),'ok');
      }catch(e2){
        log('Write failed ('+label+'): '+errText(e2),'bad');
      }
    }
    await new Promise(function(r){ setTimeout(r,150); });
  });
  return q;
}

function decodeFeature(dv){
  if(dv.byteLength<8){ log('Feature value short: '+hex(dv),'warn'); return; }
  var machine=dv.getUint32(0,true), target=dv.getUint32(4,true);
  log('Feature bits: machine=0x'+machine.toString(16)+' target=0x'+target.toString(16),'dim');
  log((target&0x01)?'Speed target setting: SUPPORTED':'Speed target setting: not advertised',
      (target&0x01)?'ok':'warn');
  if(target&0x02) log('Inclination target setting: supported','dim');
}

function onIndicate(e){
  var d=e.target.value;
  if(d.byteLength>=3 && d.getUint8(0)===0x80){
    var op=d.getUint8(1), res=d.getUint8(2);
    var names={1:'success',2:'op code not supported',3:'invalid parameter',
               4:'operation failed',5:'control not permitted'};
    log('Reply to 0x'+op.toString(16).padStart(2,'0')+': '+(names[res]||('code '+res)),
        res===1?'ok':'bad');
  }else{
    log('Notify: '+hex(d),'dim');
  }
}

async function go(){
  cp=null; feat=null;
  ['s3','s6','s10','ctrl','start','stop'].forEach(function(id){
    document.getElementById(id).disabled=true;
  });
  if(!navigator.bluetooth){ log('No Bluetooth API — use Bluefy.','bad'); return; }

  log('--- new attempt ---','dim');
  try{
    dev = await navigator.bluetooth.requestDevice({acceptAllDevices:true,optionalServices:OPT});
  }catch(e){
    log('Picker: '+errText(e),'warn');
    return;
  }
  log('Picked: '+(dev.name||'(unnamed)'),'ok');

  var server=null;
  for(var a=1;a<=3&&!server;a++){
    try{
      server = await withTimeout(dev.gatt.connect(),12000,'gatt.connect');
      log('GATT connected.','ok');
    }catch(e){
      log('connect attempt '+a+': '+errText(e),'bad');
      try{ dev.gatt.disconnect(); }catch(_){}
      await new Promise(function(r){ setTimeout(r,1200); });
    }
  }
  if(!server) return;

  var svcs=[];
  try{ svcs = await withTimeout(server.getPrimaryServices(),10000,'services'); }
  catch(e){ log('Service discovery: '+errText(e),'bad'); return; }

  for(var i=0;i<svcs.length;i++){
    var chs=[];
    try{ chs = await svcs[i].getCharacteristics(); }catch(e){ continue; }
    for(var j=0;j<chs.length;j++){
      var k=key(chs[j].uuid);
      if(k==='2ad9') cp=chs[j];
      if(k==='2acc') feat=chs[j];
    }
  }

  if(!cp){ log('No control point (2AD9) found.','bad'); return; }
  log('Control point found ['+props(cp)+']','ok');

  if(feat){
    try{ decodeFeature(await feat.readValue()); }
    catch(e){ log('Could not read feature: '+errText(e),'warn'); }
  }

  try{
    await cp.startNotifications();
    cp.addEventListener('characteristicvaluechanged',onIndicate);
    log('Listening for replies.','ok');
  }catch(e){ log('Subscribe: '+errText(e),'warn'); }

  ['s3','s6','s10','ctrl','start','stop'].forEach(function(id){
    document.getElementById(id).disabled=false;
  });

  await cpWrite([0x00],'request control');
  await cpWrite([0x07],'start/resume');
  log('Now try a speed button.','ok');
}

function speed(kmh){
  var v=Math.round(kmh*100);
  cpWrite([0x02, v&0xFF, (v>>8)&0xFF], 'target speed '+kmh+' km/h');
}

document.getElementById('scan').addEventListener('click',go);
document.getElementById('s3').addEventListener('click',function(){ speed(3); });
document.getElementById('s6').addEventListener('click',function(){ speed(6); });
document.getElementById('s10').addEventListener('click',function(){ speed(10); });
document.getElementById('ctrl').addEventListener('click',function(){ cpWrite([0x00],'request control'); });
document.getElementById('start').addEventListener('click',function(){ cpWrite([0x07],'start/resume'); });
document.getElementById('stop').addEventListener('click',function(){ cpWrite([0x08,0x01],'stop'); });
document.getElementById('copy').addEventListener('click',function(){
  if(navigator.clipboard) navigator.clipboard.writeText(logEl.innerText).then(function(){ log('Copied.','dim'); });
  else log('Select and copy manually.','warn');
});

log('Ready. Bluetooth API '+(navigator.bluetooth?'available.':'MISSING.'), navigator.bluetooth?'ok':'bad');
})();
</script>
</body>
</html>
